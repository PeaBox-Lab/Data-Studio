[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-studio"
version = "0.39.0.dev0"
description = "A local-first analytics workbench: clean, analyze, visualize and report."
readme = "README.md"
requires-python = ">=3.11"
license = "Proprietary"
authors = [{ name = "Data Studio" }]
keywords = ["analytics", "statistics", "data-cleaning", "dashboards", "duckdb"]

dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
stats = ["scipy>=1.13", "statsmodels>=0.14"]
ml = ["scikit-learn>=1.5"]
excel = ["openpyxl>=3.1"]
viz = ["matplotlib>=3.9", "plotly>=5.24"]
desktop = ["PySide6>=6.7"]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[project.scripts]
data-studio = "data_studio.cli.main:run"

[tool.setuptools.packages.find]
include = ["data_studio*"]

[tool.setuptools.package-data]
"data_studio.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:data_studio.*",
]

[tool.coverage.run]
source = ["data_studio"]
omit = ["data_studio/ui/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  "data_studio_v0.38.py",
  "data_studio_*_v0_38.py",
  "data_studio_headless_v0.38.py",
  "data_studio_ci_v0.38.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["data_studio"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
