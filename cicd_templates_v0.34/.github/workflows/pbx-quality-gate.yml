name: PBX Data Eng Quality Gate
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements_v0.34.txt
      - run: python -m py_compile python_data_workbench_v0.34.py workbench_headless_v0.34.py
      - run: python pbx_ci_v0.34.py --report ci-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbx-ci-evidence-${{ matrix.python-version }}
          path: ci-report.json
